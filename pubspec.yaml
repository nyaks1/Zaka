name: zaka
description: "Zaka — cash tracker and cash-runway forecast for South Africa."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  intl: ^0.20.3
  csv: ^8.0.0
  file_selector: ^1.1.0
  pdf_document: ^10.0.0
  pdf_graphics: ^10.0.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
  pdf_cos: ^10.0.0
  flutter_boxicons: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/

